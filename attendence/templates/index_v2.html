<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Smart Attendance System - Pro Edition</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; 
            --border: #334155; --btn-bg: #0284c7; --btn-hover: #02689c; --success: #22c55e;
        }
        [data-theme="cyberpunk"] {
            --bg: #050505; --card: #121212; --text: #00ffcc; --accent: #ff007f;
            --border: #333; --btn-bg: #ff007f; --btn-hover: #cc0066; --success: #00ffcc;
        }
        [data-theme="light"] {
            --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #0284c7;
            --border: #cbd5e1; --btn-bg: #0284c7; --btn-hover: #0369a1; --success: #16a34a;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        .wrapper { max-width: 950px; margin: auto; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: var(--accent); margin: 0; }
        
        .theme-selector select { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px; border-radius: 6px; cursor: pointer; }

        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .tabs button { background: var(--border); color: var(--text); border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .tabs button.active { background: var(--btn-bg); color: #fff; }

        .section { display: none; }
        .section.active { display: block; }

        video { width: 100%; max-height: 280px; border-radius: 8px; background: #000; object-fit: cover; border: 2px solid var(--border); }
        input, select { padding: 12px; margin: 8px 0; width: 100%; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); box-sizing: border-box; }
        
        button.action-btn { background: var(--success); color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button.action-btn:hover { opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid var(--border); padding: 10px; text-align: left; }
        th { background: var(--border); color: var(--text); }
        .low-attendance { color: #f87171; font-weight: bold; }
        .status-msg { text-align: center; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header-bar">
            <h2>Smart Attendance System</h2>
            <div class="theme-selector">
                <label>Theme: </label>
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Dark Modern</option>
                    <option value="cyberpunk">Cyberpunk Neon</option>
                    <option value="light">Clean Light</option>
                </select>
            </div>
        </div>
        
        <div class="tabs">
            <button class="active" onclick="switchTab('markTab', this)">Mark Attendance</button>
            <button onclick="switchTab('addStudentTab', this)">Add Student</button>
            <button onclick="switchTab('analyticsTab', this); loadAnalytics();">Analytics & Filters</button>
            <button onclick="switchTab('reportTab', this); loadStudentsDropdown();">Reports</button>
        </div>

        <!-- TAB 1: MARK ATTENDANCE -->
        <div id="markTab" class="section active">
            <h3>Live Webcam Recognition</h3>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            <label>Select Student to Verify:</label>
            <select id="studentSelect"></select>
            <button class="action-btn" onclick="markAttendance()">Capture & Mark Attendance</button>
            <p id="markStatus" class="status-msg"></p>
        </div>

        <!-- TAB 2: ADD STUDENT -->
        <div id="addStudentTab" class="section">
            <h3>Student Registration Form</h3>
            <input type="text" id="addRoll" placeholder="Roll Number / Code (e.g., STU001)">
            <input type="text" id="addName" placeholder="Full Name">
            <input type="text" id="addFather" placeholder="Father's Name">
            <input type="text" id="addMother" placeholder="Mother's Name">
            <button class="action-btn" onclick="registerStudent()">Save Student Profile</button>
            <p id="addStatus" class="status-msg"></p>
        </div>

        <!-- TAB 3: ANALYTICS & FILTERS -->
        <div id="analyticsTab" class="section">
            <h3>Attendance Tracking & Analytics</h3>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="Search by name, roll, or parent name..." onkeyup="loadAnalytics()" style="flex: 2; margin: 0;">
                <select id="filterSelect" onchange="loadAnalytics()" style="flex: 1; margin: 0;">
                    <option value="all">All Records</option>
                    <option value="monthly">This Month</option>
                    <option value="yearly">This Year</option>
                    <option value="low_attendance">Low Attendance (<75%)</option>
                </select>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Roll</th>
                        <th>Name</th>
                        <th>Parents</th>
                        <th>Present Days</th>
                        <th>Percentage</th>
                    </tr>
                </thead>
                <tbody id="analyticsTableBody"></tbody>
            </table>
        </div>

        <!-- TAB 4: REPORTS -->
        <div id="reportTab" class="section">
            <h3>Attendance Report Generator</h3>
            <label>Select Student:</label>
            <select id="reportStudentSelect">
                <option value="">-- All Students --</option>
            </select>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;"><label>Start Date:</label><input type="date" id="startDate"></div>
                <div style="flex: 1;"><label>End Date:</label><input type="date" id="endDate"></div>
            </div>
            <button class="action-btn" onclick="fetchReport()" style="margin-top: 15px;">Generate Report</button>
            
            <table>
                <thead>
                    <tr>
                        <th>Roll</th>
                        <th>Name</th>
                        <th>Father's Name</th>
                        <th>Timestamp</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Theme switching logic
        function changeTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeSelect').value = savedTheme;

        // Tabs switching logic
        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            if(tabId === 'markTab') loadStudentsDropdown();
        }

        // Camera feed initialization
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("Camera access error: ", err); });

        // Load Students into Dropdowns
        function loadStudentsDropdown() {
            fetch('/api/students')
            .then(res => res.json())
            .then(data => {
                let options = '';
                let reportOptions = '<option value="">-- All Students --</option>';
                data.forEach(s => {
                    options += `<option value="${s.id}">${s.name} (${s.student_code})</option>`;
                    reportOptions += `<option value="${s.id}">${s.name} (${s.student_code})</option>`;
                });
                document.getElementById('studentSelect').innerHTML = options;
                document.getElementById('reportStudentSelect').innerHTML = reportOptions;
            });
        }
        loadStudentsDropdown();

        // Mark Attendance Action
        function markAttendance() {
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg');
            const studentId = document.getElementById('studentSelect').value;
            const statusText = document.getElementById('markStatus');

            statusText.innerText = "Processing face frame...";
            fetch('/api/mark', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData, student_id: parseInt(studentId) })
            })
            .then(res => res.json())
            .then(data => {
                statusText.style.color = data.success ? "var(--success)" : "#f87171";
                statusText.innerText = data.message;
            }).catch(() => {
                statusText.style.color = "#f87171";
                statusText.innerText = "Connection error.";
            });
        }

        // Register Student Action
        function registerStudent() {
            const payload = {
                student_code: document.getElementById('addRoll').value,
                name: document.getElementById('addName').value,
                father_name: document.getElementById('addFather').value,
                mother_name: document.getElementById('addMother').value
            };
            fetch('/api/students/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                const status = document.getElementById('addStatus');
                status.style.color = data.success ? "var(--success)" : "#f87171";
                status.innerText = data.message || data.error;
                if(data.success) {
                    loadStudentsDropdown();
                    document.getElementById('addRoll').value = '';
                    document.getElementById('addName').value = '';
                    document.getElementById('addFather').value = '';
                    document.getElementById('addMother').value = '';
                }
            });
        }

        // Load Analytics & Filters
        function loadAnalytics() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('filterSelect').value;
            
            fetch(`/api/analytics?filter=${filter}`)
            .then(res => res.json())
            .then(data => {
                let tbody = '';
                data.forEach(s => {
                    if(search && !s.name.toLowerCase().includes(search) && 
                       !s.student_code.toLowerCase().includes(search) && 
                       !(s.father_name && s.father_name.toLowerCase().includes(search)) && 
                       !(s.mother_name && s.mother_name.toLowerCase().includes(search))) {
                        return;
                    }
                    
                    let pctClass = s.attendance_percentage < 75 ? 'low-attendance' : '';
                    tbody += `<tr>
                        <td>${s.student_code}</td>
                        <td>${s.name}</td>
                        <td>F: ${s.father_name || '-'}<br>M: ${s.mother_name || '-'}</td>
                        <td>${s.present_days}</td>
                        <td class="${pctClass}">${s.attendance_percentage}%</td>
                    </tr>`;
                });
                document.getElementById('analyticsTableBody').innerHTML = tbody || `<tr><td colspan="5" style="text-align:center;">No records found</td></tr>`;
            });
        }

        // Reports Generation Action
        function fetchReport() {
            const studentId = document.getElementById('reportStudentSelect').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            let url = `/api/report?start_date=${startDate}&end_date=${endDate}`;
            if(studentId) url += `&student_id=${studentId}`;

            fetch(url)
            .then(res => res.json())
            .then(data => {
                let tbody = '';
                data.forEach(r => {
                    tbody += `<tr>
                        <td>${r.student_code}</td>
                        <td>${r.name}</td>
                        <td>${r.father_name || '-'}</td>
                        <td>${r.timestamp}</td>
                        <td>${r.status}</td>
                    </tr>`;
                });
                document.getElementById('reportTableBody').innerHTML = tbody || `<tr><td colspan="5" style="text-align:center;">No reports found for selected range</td></tr>`;
            });
        }
    </script>
</body>
</html>
